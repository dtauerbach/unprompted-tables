name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly, so a change on the site's main that breaks a Table shows up here
  # even when nothing in this repo changed. 07:40 UTC, night in New York.
  schedule:
    - cron: "40 7 * * *"

permissions:
  contents: read

jobs:
  check:
    # The nightly run is only for the Tables against the site's main.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAFIA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mafia_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rps_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE mafia_test"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build -w rps-table
      - run: npm run build -w mafia-table

  # Each Table plays against a real local Unprompted, twice: at a site commit
  # known to speak the pass format (docs/GAMES.md in the site repo), which
  # must pass, and at the site's main, which is advisory so a site change
  # can't block this repo but shows up red here the day it lands.
  table-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.site == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        table: [rps, mafia]
        # Known pass-compatible site; update deliberately with its API.
        site: [73f9cccc28e72a1b94fe6dde31f13391569fe9cf, main]
    name: ${{ matrix.table }} eval (site ${{ matrix.site == 'main' && 'main' || 'pinned' }})
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: tables
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: dtauerbach/unprompted
          ref: ${{ matrix.site }}
          path: unprompted
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tables/package-lock.json
            unprompted/package-lock.json
      - run: npm ci
        working-directory: tables
      - run: npm ci
        working-directory: unprompted
      - if: matrix.table == 'mafia'
        run: npx tsx tables/mafia/evals/run-local.ts
        working-directory: tables
        env:
          SITE_DIR: ${{ github.workspace }}/unprompted
      - if: matrix.table == 'rps'
        run: ./evals/run-local.sh
        working-directory: tables/tables/rps
        env:
          SITE_DIR: ${{ github.workspace }}/unprompted
          LOGS: ${{ github.workspace }}/tables/tables/rps/evals/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.table }}-eval-site-${{ matrix.site == 'main' && 'main' || 'pinned' }}
          path: tables/tables/${{ matrix.table }}/evals/out/
          if-no-files-found: ignore
          retention-days: 14

  # An advisory upstream shouldn't block every change, so this is reported
  # on its own and doesn't fail the build.
  audit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
